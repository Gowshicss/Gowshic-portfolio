<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#fmBg)"/>
  
  <rect x="60" y="60" width="680" height="380" rx="8" fill="#11141c" stroke="#252a36" stroke-width="1.5"/>
  <rect x="60" y="60" width="680" height="42" rx="8" fill="#181c26"/>
  <circle cx="85" cy="81" r="5" fill="#ef4444"/>
  <circle cx="102" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="119" cy="81" r="5" fill="#10b981"/>
  <rect x="150" y="72" width="230" height="18" rx="4" fill="#0d1117"/>
  <text x="165" y="85" fill="#64748b" font-family="'Space Grotesk', monospace" font-size="11">factorymind.ai/telemetry-monitor</text>

  <!-- Industrial AI Schematic & Dashboard -->
  <g transform="translate(90, 125)">
    <!-- Node network for industrial monitoring -->
    <rect x="0" y="0" width="280" height="280" rx="6" fill="#161922" stroke="#252a36"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Factory Telemetry Pipeline</text>
    <text x="20" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Sensor stream analysis &amp; anomalies</text>
    
    <!-- Factory equipment nodes -->
    <circle cx="60" cy="110" r="18" fill="#1e2433" stroke="#3b82f6" stroke-width="2"/>
    <text x="52" y="115" fill="#3b82f6" font-family="sans-serif" font-size="10" font-weight="700">M1</text>

    <circle cx="140" cy="80" r="18" fill="#1e2433" stroke="#10b981" stroke-width="2"/>
    <text x="132" y="85" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">M2</text>

    <circle cx="220" cy="110" r="18" fill="#1e2433" stroke="#f59e0b" stroke-width="2"/>
    <text x="212" y="115" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700">M3</text>

    <circle cx="140" cy="180" r="24" fill="#1e2433" stroke="#a855f7" stroke-width="2"/>
    <text x="125" y="184" fill="#a855f7" font-family="sans-serif" font-size="9" font-weight="700">AI CORE</text>

    <!-- Connectors -->
    <line x1="75" y1="118" x2="120" y2="168" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="140" y1="98" x2="140" y2="156" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="205" y1="118" x2="160" y2="168" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="20" y="245" fill="#10b981" font-family="monospace" font-size="11">✓ Telemetry Stream: Normal</text>
    <text x="20" y="265" fill="#94a3b8" font-family="monospace" font-size="10">Active Sensors: 14 Nodes Connected</text>
  </g>

  <!-- Right side: Data cards -->
  <g transform="translate(390, 125)">
    <rect x="0" y="0" width="310" height="130" rx="6" fill="#161922" stroke="#252a36"/>
    <text x="20" y="28" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Industrial Operations Status</text>
    <text x="20" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Predictive equipment maintenance model</text>
    
    <rect x="20" y="70" width="125" height="42" rx="4" fill="#1c212d"/>
    <text x="30" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10">VIBRATION DRIFT</text>
    <text x="30" y="104" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">&lt; 0.04 mm/s</text>

    <rect x="160" y="70" width="130" height="42" rx="4" fill="#1c212d"/>
    <text x="170" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10">TEMP STABILITY</text>
    <text x="170" y="104" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Nominal 42°C</text>

    <rect x="0" y="145" width="310" height="135" rx="6" fill="#161922" stroke="#252a36"/>
    <text x="20" y="173" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Hackathon Award Winner</text>
    <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Awarded 3rd Place (₹1,000 Prize)</text>
    <text x="20" y="218" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Engineered by Gowshic &amp; Team</text>
    <rect x="20" y="235" width="105" height="24" rx="4" fill="#2563eb"/>
    <text x="32" y="251" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">AI In Industry</text>
  </g>
</svg>

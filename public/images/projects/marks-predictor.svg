<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <rect width="900" height="560" fill="#0A0A0A"/>
  
  <rect x="40" y="40" width="820" height="480" rx="6" fill="#141414" stroke="#303030" stroke-width="1.5"/>
  <rect x="40" y="40" width="820" height="44" rx="6" fill="#1C1C1C"/>
  <circle cx="65" cy="62" r="5" fill="#C9A44C"/>
  <rect x="130" y="52" width="280" height="20" rx="3" fill="#0A0A0A"/>
  <text x="145" y="66" fill="#B7B7B7" font-family="'Space Grotesk', monospace" font-size="11">linear_regression // Study Hours vs Examination Marks</text>

  <!-- Left: Scatter plot + Regression line -->
  <g transform="translate(65, 105)">
    <rect x="0" y="0" width="460" height="390" rx="4" fill="#1C1C1C" stroke="#303030"/>
    <text x="30" y="38" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">OLS Regression Scatter &amp; Best-Fit</text>
    
    <!-- Axes -->
    <line x1="60" y1="340" x2="420" y2="340" stroke="#303030" stroke-width="1.5"/>
    <line x1="60" y1="70" x2="60" y2="340" stroke="#303030" stroke-width="1.5"/>
    <text x="360" y="360" fill="#B7B7B7" font-family="sans-serif" font-size="11">Study Hours (X)</text>
    <text x="15" y="90" fill="#B7B7B7" font-family="sans-serif" font-size="11">Marks (Y)</text>

    <!-- Points -->
    <circle cx="90" cy="310" r="4.5" fill="#FFFFFF"/>
    <circle cx="130" cy="285" r="4.5" fill="#FFFFFF"/>
    <circle cx="170" cy="290" r="4.5" fill="#FFFFFF"/>
    <circle cx="210" cy="250" r="4.5" fill="#FFFFFF"/>
    <circle cx="250" cy="220" r="4.5" fill="#FFFFFF"/>
    <circle cx="290" cy="230" r="4.5" fill="#FFFFFF"/>
    <circle cx="330" cy="170" r="4.5" fill="#FFFFFF"/>
    <circle cx="370" cy="140" r="4.5" fill="#FFFFFF"/>
    <circle cx="400" cy="115" r="4.5" fill="#FFFFFF"/>

    <!-- Gold Regression Line -->
    <line x1="70" y1="325" x2="415" y2="105" stroke="#C9A44C" stroke-width="2.5"/>
  </g>

  <!-- Right: Formulation -->
  <g transform="translate(545, 105)">
    <rect x="0" y="0" width="290" height="390" rx="4" fill="#1C1C1C" stroke="#303030"/>
    <text x="25" y="40" fill="#C9A44C" font-family="monospace" font-size="12">// ML EXPERIMENT</text>
    <text x="25" y="70" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Marks Predictor</text>
    
    <text x="25" y="110" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="13">Model: Ordinary Least Squares</text>
    <text x="25" y="135" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="13">Language: Python (Scikit-Learn)</text>
    <text x="25" y="160" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="13">Objective: Residual analysis</text>

    <rect x="25" y="195" width="240" height="75" rx="3" fill="#141414" stroke="#2B2B2B"/>
    <text x="35" y="225" fill="#C9A44C" font-family="monospace" font-size="13">y = m·x + c</text>
    <text x="35" y="248" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="11">Evaluated MSE, RMSE &amp; R² Score</text>

    <rect x="25" y="290" width="240" height="75" rx="3" fill="#141414" stroke="#2B2B2B"/>
    <text x="35" y="315" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Educational Scope</text>
    <text x="35" y="335" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="11">Explores correlation vs causation in univariate models.</text>
  </g>
</svg>

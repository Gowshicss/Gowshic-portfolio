<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <rect width="900" height="560" fill="#0A0A0A"/>
  
  <rect x="40" y="40" width="820" height="480" rx="6" fill="#141414" stroke="#303030" stroke-width="1.5"/>
  <rect x="40" y="40" width="820" height="44" rx="6" fill="#1C1C1C"/>
  <circle cx="65" cy="62" r="5" fill="#C9A44C"/>
  <rect x="130" y="52" width="280" height="20" rx="3" fill="#0A0A0A"/>
  <text x="145" y="66" fill="#B7B7B7" font-family="'Space Grotesk', monospace" font-size="11">technova.internal // Student Profile Audit</text>

  <!-- Detailed profile inspection screen -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="760" height="380" rx="4" fill="#1C1C1C" stroke="#303030"/>
    <text x="35" y="45" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Student Profile &amp; Placement Readiness Dossier</text>
    <line x1="35" y1="65" x2="725" y2="65" stroke="#303030" stroke-width="1"/>

    <!-- Left column: student info -->
    <rect x="35" y="90" width="320" height="250" rx="4" fill="#141414" stroke="#2B2B2B"/>
    <text x="55" y="125" fill="#C9A44C" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">CANDIDATE METRICS</text>
    <text x="55" y="160" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">Department: Information Technology</text>
    <text x="55" y="190" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">Verified Projects: 3 Deployed</text>
    <text x="55" y="220" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">Core Strengths: Python, AI/ML, Full-Stack</text>
    <text x="55" y="250" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">Status: Eligible for Tier-1 Drives</text>

    <!-- Right column: interview scorecard -->
    <rect x="385" y="90" width="340" height="250" rx="4" fill="#141414" stroke="#2B2B2B"/>
    <text x="405" y="125" fill="#C9A44C" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">TECHNICAL BENCHMARKS</text>
    
    <text x="405" y="165" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="12">DSA &amp; Problem Solving</text>
    <rect x="405" y="175" width="300" height="8" rx="2" fill="#2B2B2B"/>
    <rect x="405" y="175" width="240" height="8" rx="2" fill="#C9A44C"/>

    <text x="405" y="215" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="12">System &amp; API Architecture</text>
    <rect x="405" y="225" width="300" height="8" rx="2" fill="#2B2B2B"/>
    <rect x="405" y="225" width="260" height="8" rx="2" fill="#FFFFFF"/>

    <text x="405" y="265" fill="#B7B7B7" font-family="system-ui, sans-serif" font-size="12">Communication &amp; Leadership</text>
    <rect x="405" y="275" width="300" height="8" rx="2" fill="#2B2B2B"/>
    <rect x="405" y="275" width="275" height="8" rx="2" fill="#C9A44C"/>
  </g>
</svg>
